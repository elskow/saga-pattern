x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
      env: OTEL_SERVICE_NAME,LOG_LEVEL
      labels: com.docker.compose.service
      tag: "{{.Name}}"
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M

services:
  order-service-choreography:
    <<: *service-defaults
    container_name: order-service-choreography
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: choreography-saga/order-service
    image: saga-pattern/order-service-choreography:local
    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: chor-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@chor-order-db:5432/order_db?sslmode=disable
      INVENTORY_SERVICE_URL: http://inventory-service-choreography:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: choreography-order-service
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8081"
      - "prometheus.path=/actuator/prometheus"

  payment-service-choreography:
