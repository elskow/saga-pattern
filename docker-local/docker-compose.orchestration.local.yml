x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
      env: OTEL_SERVICE_NAME,LOG_LEVEL
      labels: com.docker.compose.service
      tag: "{{.Name}}"
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M

x-order-service-base: &order-service-base
  <<: *service-defaults
  build:
    context: ..
    dockerfile: Dockerfile.choreography
    args:
      SERVICE_PATH: orchestration-saga/order-service
  image: saga-pattern/order-service-orchestration:local
  environment: &order-service-env
    DB_HOST: orch-order-db
    DB_PORT: 5432
    DB_NAME: order_db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DATABASE_URL: postgres://postgres:postgres@orch-order-db:5432/order_db?sslmode=disable
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BROKERS: kafka:29092
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
    OTEL_SERVICE_NAME: orchestration-order-service
    LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-45s}
    SAGA_TIMEOUT: ${SAGA_TIMEOUT:-180s}
    PAYMENT_SERVICE_URL: http://payment-service-orchestration:8092
    INVENTORY_SERVICE_URL: http://inventory-service-orchestration:8093
    SHIPPING_SERVICE_URL: http://shipping-service-orchestration:8094
  labels:
    - "prometheus.scrape=true"
    - "prometheus.path=/actuator/prometheus"

services:
  order-service-orchestration:
    <<: *order-service-base
    container_name: order-service-orchestration
    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8091:8091"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8091
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8091"
      - "prometheus.path=/actuator/prometheus"

  order-service-orchestration-2:
    <<: *order-service-base
    container_name: order-service-orchestration-2
    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8095:8095"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8095
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8095/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8095"
      - "prometheus.path=/actuator/prometheus"
    profiles:
      - scale2
      - scale3
      - scale4

  order-service-orchestration-3:
    <<: *order-service-base
    container_name: order-service-orchestration-3
    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8096:8096"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8096
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8096/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8096"
      - "prometheus.path=/actuator/prometheus"
    profiles:
      - scale3
      - scale4

  order-service-orchestration-4:
    <<: *order-service-base
    container_name: order-service-orchestration-4
    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8097:8097"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8097
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8097/actuator/health"]
      interval: 10s
