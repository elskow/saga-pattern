    cpus: '2.0'
    mem_limit: 1G
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      DB_HOST: orch-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@orch-payment-db:5432/payment_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: orchestration-payment-service
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      SUITE_LABEL: ${SUITE_LABEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/actuator/health"]
      interval: 10s
