hostPort: kafka:9999
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  # Broker topic metrics
  - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>Count
    name: kafka_server_broker_topic_metrics_$1_total
    type: COUNTER
    labels:
      topic: "$2"
  # Partition count
  - pattern: kafka.server<type=ReplicaManager, name=PartitionCount><>Value
    name: kafka_server_replica_manager_partition_count
    type: GAUGE
  # Consumer group lag (via consumer fetcher)
  - pattern: kafka.server<type=FetcherLagMetrics, name=ConsumerLag, clientId=(.+), topic=(.+), partition=(.+)><>Value
    name: kafka_server_fetcher_lag
    type: GAUGE
    labels:
      client_id: "$1"
      topic: "$2"
      partition: "$3"
  # Request metrics
  - pattern: kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>Count
    name: kafka_network_request_total_time_ms_count
    type: COUNTER
    labels:
      request: "$1"
  - pattern: kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(.+)><>Mean
    name: kafka_network_request_total_time_ms_mean
    type: GAUGE
    labels:
      request: "$1"
  # Active controller
  - pattern: kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value
    name: kafka_controller_active_controller_count
    type: GAUGE
  # Under-replicated partitions
  - pattern: kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value
    name: kafka_server_under_replicated_partitions
    type: GAUGE
