x-common: &common
  networks:
    - saga-network
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

services:
  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Host 9102 (not 9100): node-exporter uses network_mode:host and default :9100
      - "9102:9000"
      - "9101:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    # Never pull at runtime: a missing image must fail fast via preflight-obs-campaign.sh,
    # not trigger a flaky mid-campaign CloudFront pull that times out and aborts the suite.
    pull_policy: never
    container_name: minio-init
    networks:
      - saga-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        for b in mimir-blocks mimir-rules tempo loki pyroscope; do
          mc mb -p "local/$$b" || true
        done
        exit 0
    restart: "no"

  grafana:
    <<: *common
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor flameGraph traceToMetrics traceToProfiles correlations
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
      mimir:
        condition: service_started
      loki:
        condition: service_started

  mimir:
    <<: *common
    image: grafana/mimir:latest
    container_name: mimir
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "9009:9009"
    volumes:
      - ./grafana/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=87600h
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tempo:
    <<: *common
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./grafana/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  loki:
    <<: *common
    image: grafana/loki:3.2.0
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  alloy:
    <<: *common
    image: grafana/alloy:v1.10.2
    container_name: alloy
    privileged: true
    pid: host
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/host/proc:ro
      - alloy_symb_cache:/tmp/symb-cache
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  pyroscope:
    <<: *common
    image: grafana/pyroscope:1.14.1
    container_name: pyroscope
    command:
      - -config.file=/etc/pyroscope/pyroscope.yaml
      - -compactor.blocks-retention-period=0
      - -querier.max-query-lookback=0
      - -pyroscopedb.retention-policy-disable
    ports:
      - "4040:4040"
    volumes:
      - ./grafana/pyroscope/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro
      - pyroscope_data:/var/lib/pyroscope
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  beyla:
    <<: *common
    image: grafana/beyla:latest
    container_name: beyla-thesis
    init: true
    privileged: true
    pid: host
    ports:
      - "8999:8999"
    environment:
      BEYLA_CONFIG_PATH: /config/beyla-config.yml
      BEYLA_OPEN_PORT: "8081,8082,8083,8084,8091,8092,8093,8094,8095,8096,8097"
      BEYLA_SERVICE_NAMESPACE: saga-pattern
      BEYLA_PROMETHEUS_PORT: "8999"
      BEYLA_METRICS_EXPORT: prometheus
      BEYLA_TRACES_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      BEYLA_BPF_TRACK_REQUEST_HEADERS: "true"
      BEYLA_BPF_TRACK_RESPONSE_HEADERS: "true"
    volumes:
      - ./grafana/beyla/config.yml:/config/beyla-config.yml:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
    depends_on:
      - alloy

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    pid: host
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro

networks:
  saga-network:
    external: true

volumes:
  grafana_data:
  prometheus_data:
  tempo_data:
  pyroscope_data:
  alloy_symb_cache:
  mimir_data:
  loki_data:
