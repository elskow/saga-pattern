multitenancy_enabled: false

blocks_storage:
  backend: s3
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/ingester
  s3:
    endpoint: minio:9000
    bucket_name: mimir-blocks
    access_key_id: minioadmin
    secret_access_key: minioadmin
    insecure: true
    bucket_lookup_type: path

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: s3
  s3:
    endpoint: minio:9000
    bucket_name: mimir-rules
    access_key_id: minioadmin
    secret_access_key: minioadmin
    insecure: true
    bucket_lookup_type: path

server:
  http_listen_port: 9009
  log_level: warn

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  # Local thesis/dev: default max_global_series_per_user=150000 rejects Prom remote_write
  # under multi-phase k6 campaigns (err-mimir-max-series-per-user HTTP 400 non-recoverable).
  # See docs/archive/p1-rw-pipeline-dig.md. 0 = unlimited for local single-tenant stack.
  max_global_series_per_user: 0
  max_global_exemplars_per_user: 100000
  # Mimir: 0 = disable block deletion (keep forever on local MinIO). Not the same as
  # Tempo block_retention: 0, which dropped trace blocks in minutes. Metrics export
  # (export-metrics.py → Mimir) is the durable path for thr/lat/spanmetrics claims.
  compactor_blocks_retention_period: 0
