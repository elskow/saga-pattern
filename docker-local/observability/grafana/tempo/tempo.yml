server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Tempo has NO official "forever". Source (tempodb/retention.go v2.8.2):
    #   cutoff = now.Add(-block_retention)
    #   if block.EndTime.Before(cutoff) → mark for deletion
    # block_retention: 0s ⇒ cutoff=now ⇒ EVERY finished block deleted next tick
    # (empty early-phase spans.csv). Forbidden.
    #
    # Practical unlimited for thesis: 100 years. Compaction still merges blocks;
    # age-based delete never fires in campaign lifetime.
    block_retention: 876000h
    # Keep post-compaction source inputs for querier poll lag (>= 2x blocklist_poll).
    compacted_block_retention: 24h

storage:
  trace:
    backend: s3
    s3:
      endpoint: minio:9000
      bucket: tempo
      access_key: minioadmin
      secret_key: minioadmin
      insecure: true
      forcepathstyle: true
    wal:
      path: /var/tempo/wal

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
