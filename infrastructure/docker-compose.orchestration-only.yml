version: '3.8'

services:
  # ============================================
  # DATABASES (Orchestration)
  # ============================================

  orchestration-order-db:
    image: postgres:15-alpine
    container_name: orchestration-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - orchestration-order-db-data:/var/lib/postgresql/data
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestration-payment-db:
    image: postgres:15-alpine
    container_name: orchestration-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - orchestration-payment-db-data:/var/lib/postgresql/data
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestration-inventory-db:
    image: postgres:15-alpine
    container_name: orchestration-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - orchestration-inventory-db-data:/var/lib/postgresql/data
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestration-shipping-db:
    image: postgres:15-alpine
    container_name: orchestration-shipping-db
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - orchestration-shipping-db-data:/var/lib/postgresql/data
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipping_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CDC SERVICE (Eventuate)
  # ============================================

  eventuate-cdc:
    image: eventuateio/eventuate-cdc-service:0.16.0.RELEASE
    container_name: eventuate-cdc
    ports:
      - "8099:8080"
    environment:
      SPRING_PROFILES_ACTIVE: EventuateTramPolling
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181

      EVENTUATE_CDC_READER_READER1_TYPE: polling
      EVENTUATE_CDC_READER_READER1_DATASOURCEURL: jdbc:postgresql://orchestration-order-db:5432/order_db
      EVENTUATE_CDC_READER_READER1_DATASOURCEUSERNAME: postgres
      EVENTUATE_CDC_READER_READER1_DATASOURCEPASSWORD: postgres
      EVENTUATE_CDC_READER_READER1_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER1_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/order
      EVENTUATE_CDC_READER_READER1_OUTBOXID: 1

      EVENTUATE_CDC_READER_READER2_TYPE: polling
      EVENTUATE_CDC_READER_READER2_DATASOURCEURL: jdbc:postgresql://orchestration-payment-db:5432/payment_db
      EVENTUATE_CDC_READER_READER2_DATASOURCEUSERNAME: postgres
      EVENTUATE_CDC_READER_READER2_DATASOURCEPASSWORD: postgres
      EVENTUATE_CDC_READER_READER2_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER2_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/payment
      EVENTUATE_CDC_READER_READER2_OUTBOXID: 2

      EVENTUATE_CDC_READER_READER3_TYPE: polling
      EVENTUATE_CDC_READER_READER3_DATASOURCEURL: jdbc:postgresql://orchestration-inventory-db:5432/inventory_db
      EVENTUATE_CDC_READER_READER3_DATASOURCEUSERNAME: postgres
      EVENTUATE_CDC_READER_READER3_DATASOURCEPASSWORD: postgres
      EVENTUATE_CDC_READER_READER3_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER3_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/inventory
      EVENTUATE_CDC_READER_READER3_OUTBOXID: 3

      EVENTUATE_CDC_READER_READER4_TYPE: polling
      EVENTUATE_CDC_READER_READER4_DATASOURCEURL: jdbc:postgresql://orchestration-shipping-db:5432/shipping_db
      EVENTUATE_CDC_READER_READER4_DATASOURCEUSERNAME: postgres
      EVENTUATE_CDC_READER_READER4_DATASOURCEPASSWORD: postgres
      EVENTUATE_CDC_READER_READER4_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_READER4_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/shipping
      EVENTUATE_CDC_READER_READER4_OUTBOXID: 4

      EVENTUATE_CDC_PIPELINE_PIPELINE1_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE1_READER: reader1
      EVENTUATE_CDC_PIPELINE_PIPELINE1_EVENTUATEDATABASESCHEMA: eventuate

      EVENTUATE_CDC_PIPELINE_PIPELINE2_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE2_READER: reader2
      EVENTUATE_CDC_PIPELINE_PIPELINE2_EVENTUATEDATABASESCHEMA: eventuate

      EVENTUATE_CDC_PIPELINE_PIPELINE3_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE3_READER: reader3
      EVENTUATE_CDC_PIPELINE_PIPELINE3_EVENTUATEDATABASESCHEMA: eventuate

      EVENTUATE_CDC_PIPELINE_PIPELINE4_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE4_READER: reader4
      EVENTUATE_CDC_PIPELINE_PIPELINE4_EVENTUATEDATABASESCHEMA: eventuate
    depends_on:
      orchestration-order-db:
        condition: service_healthy
      orchestration-payment-db:
        condition: service_healthy
      orchestration-inventory-db:
        condition: service_healthy
      orchestration-shipping-db:
        condition: service_healthy
    networks:
      - choreography_saga-network

  # ============================================
  # MICROSERVICES (Orchestration)
  # ============================================

  orchestration-order-service:
    image: saga-pattern/orchestration-order-service:latest
    container_name: orchestration-order-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestration-order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
    depends_on:
      orchestration-order-db:
        condition: service_healthy
      eventuate-cdc:
        condition: service_started
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  orchestration-payment-service:
    image: saga-pattern/orchestration-payment-service:latest
    container_name: orchestration-payment-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestration-payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
    depends_on:
      orchestration-payment-db:
        condition: service_healthy
      eventuate-cdc:
        condition: service_started
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  orchestration-inventory-service:
    image: saga-pattern/orchestration-inventory-service:latest
    container_name: orchestration-inventory-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestration-inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
    depends_on:
      orchestration-inventory-db:
        condition: service_healthy
      eventuate-cdc:
        condition: service_started
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  orchestration-shipping-service:
    image: saga-pattern/orchestration-shipping-service:latest
    container_name: orchestration-shipping-service
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://orchestration-shipping-db:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
    depends_on:
      orchestration-shipping-db:
        condition: service_healthy
      eventuate-cdc:
        condition: service_started
    networks:
      - choreography_saga-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  choreography_saga-network:
    external: true

volumes:
  orchestration-order-db-data:
  orchestration-payment-db-data:
  orchestration-inventory-db-data:
  orchestration-shipping-db-data:
