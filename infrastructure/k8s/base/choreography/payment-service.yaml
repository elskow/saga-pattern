---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: saga-test
  labels:
    app: payment-service
    pattern: choreography
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: payment-service
    pattern: choreography
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: saga-test
  labels:
    app: payment-service
    pattern: choreography
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      pattern: choreography
  template:
    metadata:
      labels:
        app: payment-service
        pattern: choreography
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: payment-service
          image: ghcr.io/elskow/saga-pattern/choreography-payment-service:latest
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_HOST
              value: "payment-db.saga-infra.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "payment_db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.saga-infra.svc.cluster.local:9092"
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin.saga-infra.svc.cluster.local:9411/api/v2/spans"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
