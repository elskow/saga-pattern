---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: saga-infra
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: saga-infra
  labels:
    app: order-db
spec:
  ports:
    - port: 5432
      name: postgres
  selector:
    app: order-db
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
  namespace: saga-infra
  labels:
    app: order-db
spec:
  serviceName: order-db
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - order_db
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - order_db
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
