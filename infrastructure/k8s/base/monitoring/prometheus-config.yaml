---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: /metrics

      # Kafka metrics via kafka-exporter (if deployed)
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka-exporter.saga-infra.svc.cluster.local:9308']
        scrape_interval: 15s
