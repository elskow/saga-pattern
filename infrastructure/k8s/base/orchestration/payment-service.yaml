---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: saga-test
  labels:
    app: payment-service
    pattern: orchestration
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app: payment-service
    pattern: orchestration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: saga-test
  labels:
    app: payment-service
    pattern: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      pattern: orchestration
  template:
    metadata:
      labels:
        app: payment-service
        pattern: orchestration
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: payment-service
          image: ghcr.io/elskow/saga-pattern/orchestration-payment-service:latest
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: SERVER_PORT
              value: "8086"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://payment-db.saga-infra.svc.cluster.local:5432/payment_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.saga-infra.svc.cluster.local:9092"
            - name: EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING
              value: "zookeeper.saga-infra.svc.cluster.local:2181"
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin.saga-infra.svc.cluster.local:9411/api/v2/spans"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 90
            periodSeconds: 10
