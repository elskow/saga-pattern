---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: /metrics

      # Choreography Saga Services
      - job_name: 'choreography-order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service.saga-test.svc.cluster.local:8081']
        scrape_interval: 5s

      - job_name: 'choreography-payment-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['payment-service.saga-test.svc.cluster.local:8082']
        scrape_interval: 5s

      - job_name: 'choreography-inventory-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['inventory-service.saga-test.svc.cluster.local:8083']
        scrape_interval: 5s

      - job_name: 'choreography-shipping-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['shipping-service.saga-test.svc.cluster.local:8084']
        scrape_interval: 5s
