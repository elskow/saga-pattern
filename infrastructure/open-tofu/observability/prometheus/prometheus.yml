global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ==========================================================================
  # PROMETHEUS SELF-MONITORING
  # ==========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================================================
  # SAGA SERVICES (Docker Compose on saga-node)
  # ==========================================================================
  # Both patterns expose order-service on port 8081
  # Run sequentially: Choreography first, then Orchestration
  # Label is added dynamically based on which pattern is running
  
  - job_name: 'saga-order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['192.168.11.152:8081']
    scrape_interval: 5s
    relabel_configs:
      - source_labels: []
        target_label: service
        replacement: order-service

  # ==========================================================================
  # INFRASTRUCTURE METRICS (Optional)
  # ==========================================================================
  # Uncomment if you want to monitor node resources
  
  # - job_name: 'saga-node'
  #   static_configs:
  #     - targets: ['192.168.11.152:9100']
  
  # - job_name: 'k6-runner'
  #   static_configs:
  #     - targets: ['192.168.11.158:9100']
