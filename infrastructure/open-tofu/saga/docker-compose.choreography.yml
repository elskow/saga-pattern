# Choreography Pattern Services
# Uses event-driven communication via Kafka

services:
  # ============================================
  # Order Service (Entry point - port 8081)
  # ============================================
  order-service:
    image: ghcr.io/elskow/saga-pattern/choreography-order-service:HEAD
    container_name: choreography-order-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://192.168.11.160:9411/api/v2/spans
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    image: ghcr.io/elskow/saga-pattern/choreography-payment-service:HEAD
    container_name: choreography-payment-service
