# Choreography Pattern Services - THESIS TESTING
# Uses event-driven communication via Kafka
# Supports scaling with: docker compose up -d --scale order-service=2

x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 768M
      reservations:
        cpus: '0.25'
        memory: 512M

services:
  # ============================================
  # Order Service (Entry point - port 8081)
  # ============================================
  order-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/choreography-order-service:${IMAGE_TAG:-latest}
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: chor-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: choreography-order-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8081"
      - "prometheus.path=/actuator/prometheus"

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/choreography-payment-service:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: 8082
      DB_HOST: chor-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: choreography-payment-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8082"
      - "prometheus.path=/actuator/prometheus"

  # ============================================
  # Inventory Service
  # ============================================
  inventory-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/choreography-inventory-service:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: 8083
      DB_HOST: chor-inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: choreography-inventory-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8083"
      - "prometheus.path=/actuator/prometheus"

  # ============================================
  # Shipping Service
  # ============================================
  shipping-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/choreography-shipping-service:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: 8084
      DB_HOST: chor-shipping-db
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: choreography-shipping-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8084"
      - "prometheus.path=/actuator/prometheus"

networks:
  default:
    name: saga-network
    external: true
