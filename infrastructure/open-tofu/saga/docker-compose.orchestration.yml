      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.11.160:4318}
      OTEL_SERVICE_NAME: orchestration-inventory-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8093"
      - "prometheus.path=/actuator/prometheus"

  shipping-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/orchestration-shipping-service:${IMAGE_TAG:-latest}
    ports:
      - "8094:8094"
    environment:
      SERVER_PORT: 8094
      DB_HOST: orch-shipping-db
