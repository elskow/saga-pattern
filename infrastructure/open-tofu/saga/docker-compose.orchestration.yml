x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 768M
      reservations:
        cpus: '0.25'
        memory: 512M

x-order-service-base: &order-service-base
  <<: *service-defaults
  image: ghcr.io/elskow/saga-pattern/orchestration-order-service:${IMAGE_TAG:-latest}
  environment: &order-service-env
    DB_HOST: orch-order-db
    DB_PORT: 5432
    DB_NAME: order_db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DATABASE_URL: postgres://postgres:postgres@orch-order-db:5432/order_db?sslmode=disable
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BROKERS: kafka:29092
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.11.160:4318}
    OTEL_SERVICE_NAME: orchestration-order-service
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SPRING_PROFILES_ACTIVE: docker
    SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    PAYMENT_SERVICE_URL: http://payment-service:8092
    INVENTORY_SERVICE_URL: http://inventory-service:8093
    SHIPPING_SERVICE_URL: http://shipping-service:8094
  labels:
    - "prometheus.scrape=true"
    - "prometheus.path=/actuator/prometheus"

services:
  order-service-1:
    <<: *order-service-base
    container_name: orch-order-service-1
    ports:
      - "8091:8091"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8091
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-service-2:
    <<: *order-service-base
    container_name: orch-order-service-2
    ports:
      - "8095:8095"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8095
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8095/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - scale2
      - scale3
      - scale4

  order-service-3:
    <<: *order-service-base
    container_name: orch-order-service-3
    ports:
      - "8096:8096"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8096
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8096/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
