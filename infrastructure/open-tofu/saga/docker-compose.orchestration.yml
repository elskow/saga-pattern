  payment-service:
    <<: *service-defaults
    image: ghcr.io/elskow/saga-pattern/orchestration-payment-service:${IMAGE_TAG:-latest}
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      DB_HOST: orch-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@orch-payment-db:5432/payment_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.11.160:4318}
      OTEL_SERVICE_NAME: orchestration-payment-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8092"
      - "prometheus.path=/actuator/prometheus"

  inventory-service:
