# Orchestration Pattern Services
# Uses a central orchestrator to coordinate the saga

services:
  # ============================================
  # Order Service (Orchestrator - port 8081)
  # ============================================
  order-service:
    image: ghcr.io/elskow/saga-pattern/orchestration-order-service:latest
    container_name: orchestration-order-service
    ports:
      - "8081:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://192.168.11.160:9411/api/v2/spans
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
      # Service URLs for orchestration
      PAYMENT_SERVICE_URL: http://payment-service:8086
      INVENTORY_SERVICE_URL: http://inventory-service:8087
      SHIPPING_SERVICE_URL: http://shipping-service:8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    image: ghcr.io/elskow/saga-pattern/orchestration-payment-service:latest
    container_name: orchestration-payment-service
    environment:
      SERVER_PORT: 8086
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://192.168.11.160:9411/api/v2/spans
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Inventory Service
  # ============================================
  inventory-service:
    image: ghcr.io/elskow/saga-pattern/orchestration-inventory-service:latest
    container_name: orchestration-inventory-service
    environment:
      SERVER_PORT: 8087
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://192.168.11.160:9411/api/v2/spans
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Shipping Service
  # ============================================
  shipping-service:
    image: ghcr.io/elskow/saga-pattern/orchestration-shipping-service:latest
    container_name: orchestration-shipping-service
    environment:
      SERVER_PORT: 8088
      DB_HOST: shipping-db
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://192.168.11.160:9411/api/v2/spans
      LOG_LEVEL: INFO
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  default:
    name: saga-network
    external: true
