x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

services:
  order-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: choreography-saga/order-service
    image: saga-pattern/choreography-order-service:local
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: chor-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@chor-order-db:5432/order_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: choreography-order-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8081"
      - "prometheus.path=/actuator/prometheus"

  payment-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: choreography-saga/payment-service
    image: saga-pattern/choreography-payment-service:local
