# Choreography Pattern Services - LOCAL BUILD
# Builds Docker images from source code for debugging
# Usage: docker compose -f docker-compose.choreography.local.yml up -d --build

services:
  # ============================================
  # Order Service (Entry point - port 8081)
  # ============================================
  order-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: choreography-saga/order-service
    image: saga-pattern/choreography-order-service:local
    container_name: choreography-order-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: chor-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOG_LEVEL: DEBUG
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

