x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

x-order-service-base: &order-service-base
  <<: *service-defaults
  build:
    context: ..
    dockerfile: Dockerfile.choreography
    args:
      SERVICE_PATH: orchestration-saga/order-service
  image: saga-pattern/orchestration-order-service:local
  environment: &order-service-env
    DB_HOST: orch-order-db
    DB_PORT: 5432
    DB_NAME: order_db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DATABASE_URL: postgres://postgres:postgres@orch-order-db:5432/order_db?sslmode=disable
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BROKERS: kafka:29092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_SERVICE_NAME: orchestration-order-service
    LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    PAYMENT_SERVICE_URL: http://payment-service:8091
    INVENTORY_SERVICE_URL: http://inventory-service:8092
    SHIPPING_SERVICE_URL: http://shipping-service:8093
  labels:
    - "prometheus.scrape=true"
    - "prometheus.path=/actuator/prometheus"

services:
  order-service-1:
    <<: *order-service-base
    ports:
      - "8085:8085"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8085
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8085"
      - "prometheus.path=/actuator/prometheus"

  order-service-2:
    <<: *order-service-base
    ports:
      - "8086:8086"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8086
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8086"
      - "prometheus.path=/actuator/prometheus"
    profiles:
      - scale2
      - scale3
      - scale4

  order-service-3:
    <<: *order-service-base
    ports:
      - "8087:8087"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8087
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8087"
      - "prometheus.path=/actuator/prometheus"
    profiles:
      - scale3
      - scale4

  order-service-4:
    <<: *order-service-base
    ports:
      - "8088:8088"
    environment:
      <<: *order-service-env
      SERVER_PORT: 8088
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8088"
      - "prometheus.path=/actuator/prometheus"
    profiles:
      - scale4

  payment-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: orchestration-saga/payment-service
    image: saga-pattern/orchestration-payment-service:local
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      DB_HOST: orch-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@orch-payment-db:5432/payment_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-payment-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8091"
      - "prometheus.path=/actuator/prometheus"

  inventory-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: orchestration-saga/inventory-service
    image: saga-pattern/orchestration-inventory-service:local
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      DB_HOST: orch-inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@orch-inventory-db:5432/inventory_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-inventory-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ARTIFICIAL_DELAY_ENABLED: ${ARTIFICIAL_DELAY_ENABLED:-false}
      ARTIFICIAL_DELAY_MS: ${ARTIFICIAL_DELAY_MS:-0}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8092"
      - "prometheus.path=/actuator/prometheus"

  shipping-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.choreography
      args:
        SERVICE_PATH: orchestration-saga/shipping-service
    image: saga-pattern/orchestration-shipping-service:local
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: 8093
      DB_HOST: orch-shipping-db
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@orch-shipping-db:5432/shipping_db?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-shipping-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8093"
      - "prometheus.path=/actuator/prometheus"

networks:
  default:
    name: saga-network
    external: true
