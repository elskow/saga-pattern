      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/inventory-service
    image: saga-pattern/orchestration-inventory-service:local
    environment:
      SERVER_PORT: 8087
      DB_HOST: orch-inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-inventory-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8087"
