# Orchestration Pattern Services - LOCAL BUILD
# Builds Docker images from source code for debugging
# Usage: docker compose -f docker-compose.orchestration.local.yml up -d --build

services:
  # ============================================
  # Order Service (Orchestrator - port 8085)
  # ============================================
  order-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/order-service
    image: saga-pattern/orchestration-order-service:local
    container_name: orchestration-order-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: orch-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOG_LEVEL: DEBUG
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      # Service URLs for orchestration
      PAYMENT_SERVICE_URL: http://payment-service:8086
      INVENTORY_SERVICE_URL: http://inventory-service:8087
      SHIPPING_SERVICE_URL: http://shipping-service:8088
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/payment-service
