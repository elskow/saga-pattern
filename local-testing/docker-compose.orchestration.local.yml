      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/shipping-service
    image: saga-pattern/orchestration-shipping-service:local
    environment:
      SERVER_PORT: 8088
      DB_HOST: orch-shipping-db
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
