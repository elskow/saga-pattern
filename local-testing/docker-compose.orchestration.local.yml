      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_HOST: orch-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOG_LEVEL: DEBUG
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Inventory Service
  # ============================================
  inventory-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/inventory-service
    image: saga-pattern/orchestration-inventory-service:local
    container_name: orchestration-inventory-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      DB_HOST: orch-inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOG_LEVEL: DEBUG
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Shipping Service
  # ============================================
  shipping-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/shipping-service
    image: saga-pattern/orchestration-shipping-service:local
    container_name: orchestration-shipping-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      DB_HOST: orch-shipping-db
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
