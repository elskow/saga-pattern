# Orchestration Pattern Services - LOCAL BUILD
# Builds Docker images from source code for debugging
# Supports scaling with: docker compose up -d --scale order-service=2
# Usage: docker compose -f docker-compose.orchestration.local.yml up -d --build

x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

services:
  # ============================================
  # Order Service (Orchestrator - port 8085)
  # ============================================
  order-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/order-service
    image: saga-pattern/orchestration-order-service:local
    ports:
      - "8085-8088:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: orch-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-order-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      # Service URLs for orchestration (using Docker DNS)
      PAYMENT_SERVICE_URL: http://payment-service:8086
      INVENTORY_SERVICE_URL: http://inventory-service:8087
      SHIPPING_SERVICE_URL: http://shipping-service:8088
      JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8085"
      - "prometheus.path=/actuator/prometheus"

  # ============================================
  # Payment Service
  # ============================================
  payment-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: Dockerfile.local
      args:
        SERVICE_PATH: orchestration-saga/payment-service
    image: saga-pattern/orchestration-payment-service:local
    environment:
      SERVER_PORT: 8086
      DB_HOST: orch-payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestration-payment-service
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      JAVA_OPTS: "-Xmx256m -Xms128m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8086"
      - "prometheus.path=/actuator/prometheus"

  # ============================================
  # Inventory Service
  # ============================================
  inventory-service:
    <<: *service-defaults
