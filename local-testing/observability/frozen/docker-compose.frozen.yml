x-common: &common
  networks:
    - saga-frozen-network
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

services:
  grafana:
    <<: *common
    image: grafana/grafana:12.1.1
    container_name: grafana-frozen-thesis
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor flameGraph traceToMetrics traceToProfiles correlations
    volumes:
      - grafana_data:/var/lib/grafana
      - ${FROZEN_ARTIFACT_DIR:?set FROZEN_ARTIFACT_DIR}/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${FROZEN_ARTIFACT_DIR:?set FROZEN_ARTIFACT_DIR}/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started

  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    container_name: prometheus-frozen-thesis
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=100y
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "9900:9090"
    volumes:
      - ${FROZEN_ARTIFACT_DIR:?set FROZEN_ARTIFACT_DIR}/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tempo:
    <<: *common
    image: grafana/tempo:2.8.2
    container_name: tempo-frozen-thesis
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3320:3200"
    volumes:
      - ${FROZEN_ARTIFACT_DIR:?set FROZEN_ARTIFACT_DIR}/config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  pyroscope:
    <<: *common
    image: grafana/pyroscope:1.14.1
    container_name: pyroscope-frozen-thesis
    command:
      - server
    ports:
      - "4404:4040"
    volumes:
      - pyroscope_data:/var/lib/pyroscope

  alloy:
    <<: *common
    image: grafana/alloy:v1.10.2
    container_name: alloy-frozen-thesis
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "13245:12345"
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ${FROZEN_ARTIFACT_DIR:?set FROZEN_ARTIFACT_DIR}/config/grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_symb_cache:/tmp/symb-cache
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      pyroscope:
        condition: service_started

networks:
  saga-frozen-network:
    name: saga-frozen-network

volumes:
  grafana_data:
    external: true
    name: saga-grafana-frozen-thesis-20260517_grafana_data
  prometheus_data:
    external: true
    name: saga-grafana-frozen-thesis-20260517_prometheus_data
  tempo_data:
    external: true
    name: saga-grafana-frozen-thesis-20260517_tempo_data
  pyroscope_data:
    external: true
    name: saga-grafana-frozen-thesis-20260517_pyroscope_data
  alloy_symb_cache:
    external: true
    name: saga-grafana-frozen-thesis-20260517_alloy_symb_cache
