global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: frozen-local
    thesis_stack: grafana-frozen

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: pyroscope
    metrics_path: /metrics
    static_configs:
      - targets: ["pyroscope:4040"]
