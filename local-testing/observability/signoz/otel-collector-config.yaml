connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: host.name

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: [localhost:8888]
              labels:
                job_name: otel-collector
        - job_name: choreography-services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - order-service-choreography:8081
                - payment-service-choreography:8082
                - inventory-service-choreography:8083
                - shipping-service-choreography:8084
              labels:
                pattern: choreography
                service_group: core
        - job_name: orchestration-services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - order-service-orchestration:8091
                - payment-service-orchestration:8092
                - inventory-service-orchestration:8093
                - shipping-service-orchestration:8094
              labels:
                pattern: orchestration
                service_group: core

  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: end
    include_file_path: true
    operators:
      - type: json_parser
        id: parse_docker_json
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      - type: move
        id: move_docker_log_to_body
        from: attributes.log
        to: body
      - type: move
        id: move_docker_stream
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: regex_parser
        id: parse_saga_slog_fields
        if: 'body matches "^time=\\S+\\s+level=\\S+\\s+msg=\\\"http request completed\\\""'
        parse_from: body
        parse_to: attributes
        regex: '^time=(?P<app_time>\S+)\s+level=(?P<level>\S+)\s+msg="(?P<message>[^"]*)"\s+service=(?P<service>\S+)\s+pattern=(?P<pattern>\S+)\s+method=(?P<method>\S+)\s+route=(?P<route>\S+)\s+path=(?P<path>\S+)\s+status=(?P<status>\d+)\s+bytes=(?P<bytes>\d+)\s+duration_ms=(?P<duration_ms>\d+)\s+trace_id=(?P<trace_id>[a-fA-F0-9]*)\s+span_id=(?P<span_id>[a-fA-F0-9]*)\s+request_id=(?P<request_id>\S+)\s+correlation_id=(?P<correlation_id>\S+)'
        on_error: send_quiet
      - type: regex_parser
        id: extract_docker_container_id
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[^/]+)/[^/]+-json\.log$'
      - type: move
        id: move_docker_container_id
        from: attributes.container_id
        to: resource["container.id"]

processors:
  batch:
    send_batch_size: 10000
    send_batch_max_size: 11000
    timeout: 10s
  batch/meter:
    send_batch_max_size: 25000
    send_batch_size: 20000
    timeout: 1s
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  transform/dockerlogs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], attributes["attrs"]["OTEL_SERVICE_NAME"]) where attributes["attrs"]["OTEL_SERVICE_NAME"] != nil
          - set(resource.attributes["container.name"], attributes["attrs"]["com.docker.compose.service"]) where attributes["attrs"]["com.docker.compose.service"] != nil
          - set(resource.attributes["container.name"], attributes["attrs"]["tag"]) where attributes["attrs"]["tag"] != nil
          - set(resource.attributes["log.level"], attributes["attrs"]["LOG_LEVEL"]) where attributes["attrs"]["LOG_LEVEL"] != nil
          - set(attributes["request.id"], attributes["request_id"]) where attributes["request_id"] != nil
          - set(attributes["correlation.id"], attributes["correlation_id"]) where attributes["correlation_id"] != nil
          - set(attributes["http.request.method"], attributes["method"]) where attributes["method"] != nil
          - set(attributes["http.route"], attributes["route"]) where attributes["route"] != nil
          - set(attributes["http.target"], attributes["path"]) where attributes["path"] != nil
          - set(attributes["http.response.status_code"], attributes["status"]) where attributes["status"] != nil
          - set(attributes["http.response.body.size"], attributes["bytes"]) where attributes["bytes"] != nil
          - set(attributes["http.request.duration_ms"], attributes["duration_ms"]) where attributes["duration_ms"] != nil
          - delete_key(attributes, "attrs") where attributes["attrs"] != nil
  filter/local-saga-logs:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["service.name"] == nil
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: local
      - name: signoz.collector.id
      - name: service.version
      - name: host.name
      - name: container.name

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

exporters:
  clickhousetraces:
    datasource: tcp://signoz-clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
  signozclickhousemetrics:
    dsn: tcp://signoz-clickhouse:9000/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://signoz-clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true
  signozclickhousemeter:
    dsn: tcp://signoz-clickhouse:9000/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://signoz-clickhouse:9000/signoz_metadata
    enabled: true
    timeout: 45s

service:
  telemetry:
    logs:
      encoding: json
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [signozspanmetrics/delta, batch]
      exporters: [clickhousetraces, metadataexporter, signozmeter]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/prometheus:
      receivers: [prometheus]
      processors: [batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    logs:
      receivers: [otlp, filelog/docker]
      processors: [transform/dockerlogs, filter/local-saga-logs, batch]
      exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
    metrics/meter:
      receivers: [signozmeter]
      processors: [batch/meter]
      exporters: [signozclickhousemeter]
