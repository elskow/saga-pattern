server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: orchestration-order-service

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN:5}
      maximum-pool-size: ${DB_POOL_MAX:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      pool-name: ${spring.application.name}-pool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: orchestration-order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        startup:
          include: readinessState,db,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    group:
      startup:
        include: readinessState,db,kafka,stuckSaga
      custom:
        include: kafka,stuckSaga
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9412/api/v2/spans}

logging:
  level:
    com.thesis.orchestration: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

saga:
  orchestrator:
    pending-command-retry-interval: ${SAGA_PENDING_RETRY_INTERVAL:10s}
    pending-command-retry-delay: ${SAGA_PENDING_RETRY_DELAY:10s}
    in-memory-saga-ttl: ${SAGA_IN_MEMORY_TTL:1h}
    in-memory-cleanup-interval: ${SAGA_IN_MEMORY_CLEANUP_INTERVAL:1m}
    saga-timeout: ${SAGA_TIMEOUT:30s}
    saga-timeout-check-interval: ${SAGA_TIMEOUT_CHECK_INTERVAL:10s}
    outbox-poll-interval: ${SAGA_OUTBOX_POLL_INTERVAL:5s}
    outbox-retry-delay: ${SAGA_OUTBOX_RETRY_DELAY:10s}
    outbox-max-attempts: ${SAGA_OUTBOX_MAX_ATTEMPTS:10}
    outbox-cleanup-interval: ${SAGA_OUTBOX_CLEANUP_INTERVAL:5m}
    outbox-retention: ${SAGA_OUTBOX_RETENTION:24h}
